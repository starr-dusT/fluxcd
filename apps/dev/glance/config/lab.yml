- name: Lab 
  width: default 
  columns:
    - size: full
      widgets:
        - type: split-column
          max-columns: 2 
          widgets: 
            - <<: *linkding
              title: Internal 
              url: https://link.tstarr.us/api/bookmarks?bundle=5&sort=title_asc
            - <<: *linkding
              title: Resources 
              url: https://link.tstarr.us/api/bookmarks?bundle=7&sort=title_asc
            - <<: *linkding
              title: Arrs 
              url: https://link.tstarr.us/api/bookmarks?bundle=11&sort=title_asc
        - type: monitor
          cache: 10m
          title: Services
          sites:
            - title: Home Assistant
              url: https://home.tstarr.us
              icon: sh:home-assistant
            - title: Gitea
              url: https://git.tstarr.us
              icon: sh:gitea
            - title: Linkding
              url: https://link.tstarr.us
              icon: sh:linkding
            - title: Nextcloud
              url: https://cloud.tstarr.us
              icon: sh:nextcloud
            - title: Jellyfin
              url: https://media.tstarr.us
              icon: sh:jellyfin
            - title: RomM
              url: https://romm.tstarr.us
              icon: sh:romm
            - title: 2FAuth
              url: https://2fa.tstarr.us
              icon: sh:2fauth
            - title: Tandoor
              url: https://tandoor.tstarr.us
              icon: sh:tandoor-recipes
            - title: LC Mattermost
              url: https://lc.tstarr.us
              icon: sh:mattermost
            - title: Guacamole
              url: https://rdp.tstarr.us
              icon: sh:apache-guacamole
            - title: RSSBridge 
              url: http://rssbridge.vortex-1.lan
              icon: sh:rss-bridge
            - title: Miniflux 
              url: http://rss.tstarr.us
              icon: sh:miniflux
        - type: monitor
          cache: 10m
          title: Infrastructure 
          sites:
            - title: Adguard 
              url: http://tetragon.lan:3003
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:adguard-home
            - title: Grafana 
              url: http://tetragon.lan:2342
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:grafana
            - title: Databasus 
              url: http://torus.lan:4005
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:databasus
            - title: qBittorrent 
              url: http://torus.lan:8089
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:qbittorrent
            - title: NZBGet 
              url: http://torus.lan:6789
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:nzbget
            - title: Prowlarr
              url: http://torus.lan:9696
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:prowlarr
            - title: Sonarr
              url: http://torus.lan:8989
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:sonarr
            - title: Radarr
              url: http://torus.lan:7878
              check-url: https://glance.tstarr.us
              allow-insecure: true
              icon: sh:radarr

    - size: small
      widgets:
        - type: custom-api
          title: Machines Up
          cache: 30s 
          url: ${GRAFANA_URL}/api/ds/query
          method: POST
          headers:
            Authorization: Bearer ${GRAFANA_TOKEN}
            Accept: application/json
          body-type: json
          body:
            queries:
              - datasource:
                  type: prometheus
                  uid: cf7tp9ngpdgxsb
                expr: count by (job) (up == 1)
                legendFormat: '{{job}}'
                refId: A
                range: true
                instant: false
                intervalMs: 60000
                maxDataPoints: 5
            from: now-5m
            to: now
          template: |
            <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "results.A.frames" }}
                <li>
                  <span style="color: #d9c28d;">{{ .String "schema.fields.1.config.displayNameFromDS" }}</span>
                </li>
              {{ end }}
            </ul>
        - type: custom-api
          title: Grafana Alerts
          cache: 30s
          url: ${GRAFANA_URL}/api/alertmanager/grafana/api/v2/alerts
          method: GET
          headers:
            Authorization: Bearer ${GRAFANA_TOKEN}
            Accept: application/json
          template: |
            <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "" }}
                {{ if eq (.String "status.state") "active" }}
                  <li>
                    <span style="color: #e06c75;">
                      {{ .String "labels.rulename" }}
                    </span>
                  </li>
                {{ end }}
              {{ end }}
            </ul>
        - type: dns-stats
          service: adguard
          url: http://69.69.1.10:3003/
        - type: releases
          show-source-icon: true
          repositories:
            - glanceapp/glance
            - go-gitea/gitea
            - home-assistant/operating-system
            - jellyfin/jellyfin
            - sissbruecker/linkding
            - nextcloud/all-in-one
            - jellyfin/jellyfin
            - Bubka/2FAuth
            - mattermost/mattermost
            - RSS-Bridge/rss-bridge
            - miniflux/v2
            - AdguardTeam/AdGuardHome
            - grafana/grafana
            - databasus/databasus
            - coder/code-server
            - apache/guacamole-server
            - TandoorRecipes/recipes
            - qbittorrent/qbittorrent
            - nzbgetcom/nzbget
            - prowlarr/prowlarr
            - sonarr/sonarr
            - radarr/radarr
